name: Test, package and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps .
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.112'
      - name: Build pinned calculation engine
        run: mcdxkit setup-engine
      - name: Run real-engine and HTTP integration tests
        run: python scripts/test_installed.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      # Runtime packages are installed so mypy checks calls against real fastapi/lxml signatures.
      - run: python -m pip install -r requirements.lock && python -m pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: mypy

  package:
    name: Installable package and browser syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --check src/mcdxkit/web/app.js && node --check src/mcdxkit/web/documents.js
      - name: Build and test the project workspace
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm test --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- src/mcdxkit/web/workspace-dist
      - name: Browser progress orchestration
        run: node --test tests/*.test.cjs
      - name: Build and inspect distribution
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_package.py
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcdxkit-python-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  container:
    name: Test and publish container
    needs: [test, lint, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: mcdxkit:test
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Execute conversion tests inside the image
        run: docker run --rm -v "$PWD:/verify:ro" --entrypoint python mcdxkit:test /verify/scripts/test_installed.py --tests /verify/tests
      - name: Smoke test deployed HTTP service
        run: |
          docker run --name mcdxkit-test -d -p 127.0.0.1:8765:8765 \
            -e MCDXKIT_PUBLIC_URL=http://127.0.0.1:8765 \
            -e MCDXKIT_ACCESS_TOKEN=synthetic-ci-token-not-a-deployment-secret mcdxkit:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/healthz
          curl --fail --output /dev/null http://127.0.0.1:8765/fonts/plex-regular.ttf
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/session)" = 401
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs mcdxkit-test 2>/dev/null || true
          docker rm -f mcdxkit-test 2>/dev/null || true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag mcdxkit:test "$image:sha-$GITHUB_SHA"
          docker tag mcdxkit:test "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          echo "Published tested linux/amd64 image: \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
