name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test release wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify release belongs to main and matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match v<pyproject version>')
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_package.py
          python -m twine check --strict dist/*
      - name: Install the built wheel
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps dist/*.whl
          mcdxkit --version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.112'
      - name: Lint and type check
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check src tests scripts
          mypy
      - name: Test installed SDK, CLI, calculator and server
        run: |
          mcdxkit setup-engine
          mkdir verify-source
          tar -xzf dist/mcdxkit-*.tar.gz -C verify-source --strip-components=1
          python verify-source/scripts/test_installed.py --tests verify-source/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mcdxkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release
          path: dist/
      - name: Upload tested distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
