[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdxkit"
version = "0.4.0"
description = "Open-source Mathcad workflow toolkit: worksheet generation, calculation, CLI and SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = ["lxml>=5.3,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1.1,<2", "pypdf>=6.20.1,<7", "huey>=3.4,<4", "langchain>=1.4.6,<2", "langchain-openai>=1.7.2,<2", "ag-ui-protocol>=1.0.0,<2", "PyJWT[crypto]>=2.10,<3", "httpx>=0.27,<1", "openai>=1.109,<3"]

[project.urls]
Homepage = "https://github.com/amaljithkuttamath/mcdxkit"
Documentation = "https://github.com/amaljithkuttamath/mcdxkit/blob/main/docs/sdk.md"
Issues = "https://github.com/amaljithkuttamath/mcdxkit/issues"
Source = "https://github.com/amaljithkuttamath/mcdxkit"

[project.scripts]
mcdxkit = "mcdxkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcdxkit = ["web/*.html", "web/*.css", "web/*.js", "web/workspace-dist/*.html", "web/workspace-dist/*.js", "web/workspace-dist/*.css", "web/workspace-dist/*.txt", "web/pdfjs/*", "web/pdfjs/standard_fonts/*", "web/pdfjs/cmaps/*", "web/pdfjs/wasm/*", "web/fonts/*.ttf", "web/fonts/OFL.txt", "calcpad_bridge/*.cs", "calcpad_bridge/*.csproj"]

[tool.ruff]
extend-exclude = ["agents", "references"]

[tool.ruff.lint]
# Correctness rules only. The codebase keeps its compact style (docs/standards.md: no
# repository-wide reformatting), so layout rules such as E701/E702 stay off.
select = ["E9", "F", "B"]
# Re-raising friendly request errors inside except blocks is intentional.
ignore = ["B904"]

[tool.mypy]
python_version = "3.10"
files = ["src/mcdxkit"]
ignore_missing_imports = true
warn_unused_ignores = true
